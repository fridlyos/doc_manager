[project]
name = "doc-manager"
version = "0.1.0"
description = "Local-first RAG document search and cataloging system (backend)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pymupdf>=1.24",
    "charset-normalizer>=3.4",
]

[project.optional-dependencies]
# External generation provider. Installed only when the OpenAI adapter is enabled.
openai = ["openai>=1.55"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
doc-manager-api = "doc_manager.main:run"
doc-manager-worker = "doc_manager.jobs.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_manager"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions keep their generated layout.
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["doc_manager"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# PyMuPDF ships no type information; treat its API as Any rather than flagging
# every call under strict mode's disallow_untyped_calls.
[[tool.mypy.overrides]]
module = "pymupdf.*"
follow_imports = "skip"
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
